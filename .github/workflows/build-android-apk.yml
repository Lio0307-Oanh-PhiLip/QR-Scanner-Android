name: Build QR Scanner APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'QR-Scanner-Android-Source.zip'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source archive
        run: |
          test -f QR-Scanner-Android-Source.zip || {
            echo "Missing QR-Scanner-Android-Source.zip in repository root."
            exit 1
          }

      - name: Extract source
        run: unzip -q QR-Scanner-Android-Source.zip

      - name: Align Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("qr-scanner-crossplatform/android/app/build.gradle")
          if not p.exists():
              raise SystemExit(f"Gradle file not found: {p}")
          s = p.read_text()
          if "sourceCompatibility JavaVersion.VERSION_17" not in s:
              marker = "android {"
              if marker not in s:
                  raise SystemExit("Could not find android { block in app/build.gradle")
              block = """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }"""
              s = s.replace(marker, block, 1)
          elif "jvmTarget = '17'" not in s:
              marker = "android {"
              block = """android {
              kotlinOptions {
                  jvmTarget = '17'
              }"""
              s = s.replace(marker, block, 1)
          p.write_text(s)
          print("Configured Java and Kotlin to target JVM 17")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: qr-scanner-crossplatform/android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QR-Scanner-Android-APK
          path: qr-scanner-crossplatform/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
