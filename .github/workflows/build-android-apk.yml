name: Build QR Scanner APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'QR-Scanner-Android-Source.zip'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source archive
        run: |
          test -f QR-Scanner-Android-Source.zip || {
            echo "Missing QR-Scanner-Android-Source.zip in repository root."
            exit 1
          }

      - name: Extract source
        run: unzip -q QR-Scanner-Android-Source.zip

      - name: Fix Android source compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("qr-scanner-crossplatform/android/app/build.gradle")
          if not gradle.exists():
              raise SystemExit(f"Gradle file not found: {gradle}")
          s = gradle.read_text()
          if "sourceCompatibility JavaVersion.VERSION_17" not in s:
              s = s.replace("android {", """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }""", 1)
          elif "jvmTarget = '17'" not in s:
              s = s.replace("android {", """android {
              kotlinOptions {
                  jvmTarget = '17'
              }""", 1)
          gradle.write_text(s)

          # ML Kit's Barcode type lives in this package. Add its import if
          # MainActivity references Barcode without importing it.
          src = Path("qr-scanner-crossplatform/android/app/src/main/java/com/example/qrscanner/MainActivity.kt")
          if not src.exists():
              matches = list(Path("qr-scanner-crossplatform/android/app/src/main").rglob("MainActivity.kt"))
              if not matches:
                  raise SystemExit("MainActivity.kt not found")
              src = matches[0]
          code = src.read_text()
          imp = "import com.google.mlkit.vision.barcode.common.Barcode"
          if "Barcode" in code and imp not in code:
              lines = code.splitlines()
              last_import = max((i for i, line in enumerate(lines) if line.startswith("import ")), default=0)
              lines.insert(last_import + 1, imp)
              src.write_text("\n".join(lines) + "\n")
          print("Configured JVM 17 and ensured ML Kit Barcode import")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: qr-scanner-crossplatform/android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QR-Scanner-Android-APK
          path: qr-scanner-crossplatform/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
